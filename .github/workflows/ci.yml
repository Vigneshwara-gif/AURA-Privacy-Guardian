name: AURA CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Tests & Quality Checks
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bytecode compilation check
        run: python -m compileall aura packaging tests

      - name: Run Pytest test suite
        run: python -m pytest --maxfail=1

      - name: Legacy app.py import verification
        run: python -c "import app; print('app.py backward compatibility OK')"

  frontend-test:
    name: Frontend Build & Type Check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript strict type check
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  packaging:
    name: Production Packaging Verification
    needs: [backend-test, frontend-test]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Python build tools
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Execute Packaging Pipeline
        run: python packaging/build.py
